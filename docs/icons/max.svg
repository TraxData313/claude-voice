<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Max — brave, driving voice">
  <!-- Original character. Flat, angular, serious in manner. No likeness of any real person. -->
  <circle cx="128" cy="128" r="124" fill="#12141c"/>
  <circle cx="128" cy="128" r="121" fill="none" stroke="#f59e0b" stroke-width="6"/>

  <clipPath id="discM"><circle cx="128" cy="128" r="118"/></clipPath>
  <g clip-path="url(#discM)">

    <!-- shoulders, dark crew top -->
    <rect x="110" y="156" width="36" height="34" fill="#eebd93"/>
    <path d="M30 258 L58 210 C80 200 176 200 198 210 L226 258 Z" fill="#26303f"/>
    <path d="M108 212 C118 220 138 220 148 212" fill="none" stroke="#1a222e" stroke-width="5"/>

    <!-- ears -->
    <rect x="79" y="116" width="9" height="16" fill="#f0b98a"/>
    <rect x="168" y="116" width="9" height="16" fill="#f0b98a"/>

    <!-- head, strong jaw drawn with corners -->
    <path d="M128 56 C154 56 172 74 173 100 L173 122 L166 148 L148 168 L128 172
             L108 168 L90 148 L83 122 L83 100 C84 74 102 56 128 56 Z" fill="#f0b98a"/>
    <path d="M92 148 L110 165 L128 169 L146 165 L164 148 L146 159 L128 163 L110 159 Z"
          fill="#e0a877"/>

    <!-- clean swept-back hair, short sideburns -->
    <path d="M83 98 C84 66 102 46 128 46 C154 46 172 66 173 98
             C166 80 152 72 128 72 C104 72 90 80 83 98 Z" fill="#b8862f"/>
    <path d="M83 96 L83 118 L90 118 L90 94 Z" fill="#b8862f"/>
    <path d="M173 96 L173 118 L166 118 L166 94 Z" fill="#b8862f"/>

    <!-- level brows, steady -->
    <path d="M96 110 L120 108 L120 114 L96 116 Z" fill="#201812"/>
    <path d="M160 110 L136 108 L136 114 L160 116 Z" fill="#201812"/>

    <!-- narrowed calm eyes -->
    <circle cx="108" cy="122" r="4.2" fill="#17181d"/>
    <circle cx="148" cy="122" r="4.2" fill="#17181d"/>
    <circle cx="106.8" cy="120.8" r="1.2" fill="#ffffff"/>
    <circle cx="146.8" cy="120.8" r="1.2" fill="#ffffff"/>
    <path d="M100 117 L116 116" fill="none" stroke="#c98d5f" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M140 116 L156 117" fill="none" stroke="#c98d5f" stroke-width="2.5" stroke-linecap="round"/>

    <!-- straight nose -->
    <path d="M128 118 L125 140 L130 143" fill="none" stroke="#c98d5f" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- firm closed mouth -->
    <path d="M116 154 L140 154" fill="none" stroke="#8c5a3c" stroke-width="4" stroke-linecap="round"/>
    <path d="M123 164 L133 164" fill="none" stroke="#c98d5f" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
