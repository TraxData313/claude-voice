<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Max — brave, driving voice">
  <!-- Original character in a flat, angular cartoon style. No likeness of any real person. -->
  <circle cx="128" cy="128" r="124" fill="#12141c"/>
  <circle cx="128" cy="128" r="121" fill="none" stroke="#f59e0b" stroke-width="6"/>

  <clipPath id="discM"><circle cx="128" cy="128" r="118"/></clipPath>
  <g clip-path="url(#discM)">

    <!-- broad shoulders, dark tank -->
    <rect x="106" y="158" width="44" height="36" fill="#eebd93"/>
    <path d="M28 258 L54 212 C74 199 182 199 202 212 L228 258 Z" fill="#26303f"/>
    <path d="M98 212 L112 258 M158 212 L144 258" fill="none" stroke="#1a222e" stroke-width="7"/>

    <!-- ears -->
    <rect x="76" y="114" width="10" height="18" fill="#f0b98a"/>
    <rect x="170" y="114" width="10" height="18" fill="#f0b98a"/>

    <!-- head: square heroic jaw, corner points not curves -->
    <path d="M128 58 C154 58 172 74 174 98 L174 120 L166 150 L146 170 L128 174
             L110 170 L90 150 L82 120 L82 98 C84 74 102 58 128 58 Z" fill="#f0b98a"/>
    <!-- hard-edged jaw shadow -->
    <path d="M90 150 L110 168 L128 172 L146 168 L166 150 L146 161 L128 165 L110 161 Z"
          fill="#dfa171"/>

    <!-- jagged swept hair -->
    <path d="M82 100 L80 74 L96 78 L94 56 L112 64 L118 46 L134 58 L150 46
             L152 64 L172 58 L168 80 L178 76 L174 100
             C164 84 150 78 128 78 C106 78 92 84 82 100 Z" fill="#d9a441"/>

    <!-- the sweatband -->
    <rect x="78" y="88" width="100" height="14" rx="3" fill="#ef4444"/>
    <rect x="78" y="98" width="100" height="4" fill="#b91c1c"/>

    <!-- heavy straight brows -->
    <path d="M94 112 L122 106 L123 113 L95 119 Z" fill="#201812"/>
    <path d="M162 112 L134 106 L133 113 L161 119 Z" fill="#201812"/>

    <!-- steady eyes -->
    <circle cx="108" cy="125" r="4.8" fill="#17181d"/>
    <circle cx="148" cy="125" r="4.8" fill="#17181d"/>
    <circle cx="106.5" cy="123.5" r="1.5" fill="#ffffff"/>
    <circle cx="146.5" cy="123.5" r="1.5" fill="#ffffff"/>

    <!-- straight angular nose -->
    <path d="M128 122 L125 139 L131 142" fill="none" stroke="#c98d5f" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- confident grin, teeth in it -->
    <path d="M110 150 L128 159 L146 150" fill="none" stroke="#7c3a26" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M116 151.5 L128 157.5 L140 151.5 L137 156 L128 160 L119 156 Z" fill="#ffffff"/>

    <!-- chin line -->
    <path d="M123 166 L133 166" fill="none" stroke="#c98d5f" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
