<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Abby — calm, warm voice">
  <!-- Original character in a flat, angular cartoon style. No likeness of any real person. -->
  <circle cx="128" cy="128" r="124" fill="#12141c"/>
  <circle cx="128" cy="128" r="121" fill="none" stroke="#5eead4" stroke-width="6"/>

  <clipPath id="disc"><circle cx="128" cy="128" r="118"/></clipPath>
  <g clip-path="url(#disc)">

    <!-- long dark hair, sharp-tipped -->
    <path d="M128 34 C84 34 58 64 58 104 L58 150 C58 168 54 184 46 196
             L70 188 L64 214 L90 200 L92 222 L112 204 L128 214 L144 204
             L164 222 L166 200 L192 214 L186 188 L210 196
             C202 184 198 168 198 150 L198 104 C198 64 172 34 128 34 Z"
          fill="#33221b"/>

    <!-- neck and shoulders -->
    <rect x="116" y="164" width="24" height="26" fill="#eebd93"/>
    <path d="M42 258 C68 206 188 206 214 258 Z" fill="#14b8a6"/>
    <path d="M110 212 L128 228 L146 212" fill="none" stroke="#0d9488" stroke-width="5" stroke-linecap="round"/>

    <!-- face, chin gently tapered -->
    <path d="M128 64 C158 64 172 88 170 116 C168 146 152 168 128 172
             C104 168 88 146 86 116 C84 88 98 64 128 64 Z" fill="#f6c9a3"/>

    <!-- side-swept angular fringe -->
    <path d="M128 42 C100 42 82 58 78 88 L96 82 L94 96 L112 86 L114 98 L130 84
             C142 72 160 74 178 92 C176 60 156 42 128 42 Z" fill="#33221b"/>

    <!-- blush -->
    <ellipse cx="99" cy="139" rx="8.5" ry="4.5" fill="#f0a087" opacity="0.35"/>
    <ellipse cx="157" cy="139" rx="8.5" ry="4.5" fill="#f0a087" opacity="0.35"/>

    <!-- slim arched brows -->
    <path d="M92 100 Q106 93 120 99" fill="none" stroke="#33221b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M136 99 Q150 93 164 100" fill="none" stroke="#33221b" stroke-width="3.5" stroke-linecap="round"/>

    <!-- big almond eyes -->
    <path d="M85 120 Q102 104 124 116 Q106 133 85 120 Z" fill="#ffffff"/>
    <path d="M171 120 Q154 104 132 116 Q150 133 171 120 Z" fill="#ffffff"/>
    <circle cx="106" cy="119" r="7" fill="#5b3a22"/>
    <circle cx="150" cy="119" r="7" fill="#5b3a22"/>
    <circle cx="106" cy="119" r="3.2" fill="#17181d"/>
    <circle cx="150" cy="119" r="3.2" fill="#17181d"/>
    <circle cx="103.5" cy="116" r="2.2" fill="#ffffff"/>
    <circle cx="147.5" cy="116" r="2.2" fill="#ffffff"/>

    <!-- lash lines, winged at the outer corners -->
    <path d="M89 119 Q104 105 122 116" fill="none" stroke="#17181d" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M89 119 L81 112" fill="none" stroke="#17181d" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M167 119 Q152 105 134 116" fill="none" stroke="#17181d" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M167 119 L175 112" fill="none" stroke="#17181d" stroke-width="4.5" stroke-linecap="round"/>

    <!-- the smallest possible nose -->
    <path d="M127 132 q-2 5 2 6" fill="none" stroke="#d99e77" stroke-width="3" stroke-linecap="round"/>

    <!-- soft small lips -->
    <path d="M115 147 Q121 143 128 146 Q135 143 141 147 Q135 156 128 156 Q121 156 115 147 Z" fill="#c14b5a"/>
    <path d="M117 148 Q128 151 139 148" fill="none" stroke="#8f3542" stroke-width="1.6"/>
  </g>
</svg>
