<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Abby — calm, warm voice">
  <!-- Original character. Flat, angular, serious in manner. No likeness of any real person. -->
  <circle cx="128" cy="128" r="124" fill="#12141c"/>
  <circle cx="128" cy="128" r="121" fill="none" stroke="#5eead4" stroke-width="6"/>

  <clipPath id="discA"><circle cx="128" cy="128" r="118"/></clipPath>
  <g clip-path="url(#discA)">

    <!-- dark hair, sharp-tipped bob -->
    <path d="M128 36 C88 36 62 66 62 106 C62 138 68 158 64 176
             L84 168 L80 190 L100 178 L102 196 L118 184 L128 190 L138 184
             L154 196 L156 178 L176 190 L172 168 L192 176
             C188 158 194 138 194 106 C194 66 168 36 128 36 Z" fill="#241812"/>

    <!-- neck and top -->
    <rect x="117" y="160" width="22" height="26" fill="#eebd93"/>
    <path d="M44 258 C70 208 186 208 212 258 Z" fill="#0f766e"/>
    <path d="M112 210 L128 222 L144 210" fill="none" stroke="#14b8a6" stroke-width="4" stroke-linecap="round"/>

    <!-- face, soft oval -->
    <path d="M128 62 C156 62 170 86 168 114 C166 142 152 164 128 168
             C104 164 90 142 88 114 C86 86 100 62 128 62 Z" fill="#f6c9a3"/>

    <!-- centre-parted curtain fringe, calm -->
    <path d="M78 92 C80 62 100 42 128 42 C158 42 178 62 178 94
             C168 78 152 70 136 70 L128 82 L122 70
             C104 70 88 78 78 92 Z" fill="#241812"/>

    <!-- thin calm brows -->
    <path d="M96 102 Q106 98 116 101" fill="none" stroke="#2a1d16" stroke-width="3" stroke-linecap="round"/>
    <path d="M140 101 Q150 98 160 102" fill="none" stroke="#2a1d16" stroke-width="3" stroke-linecap="round"/>

    <!-- calm dark eyes, mostly iris, one quiet highlight -->
    <path d="M92 118 Q104 108 120 116 Q106 127 92 118 Z" fill="#ffffff"/>
    <path d="M164 118 Q152 108 136 116 Q150 127 164 118 Z" fill="#ffffff"/>
    <circle cx="106" cy="117" r="6.5" fill="#3d2417"/>
    <circle cx="150" cy="117" r="6.5" fill="#3d2417"/>
    <circle cx="106" cy="117" r="3" fill="#17181d"/>
    <circle cx="150" cy="117" r="3" fill="#17181d"/>
    <circle cx="104" cy="114.5" r="1.6" fill="#ffffff"/>
    <circle cx="148" cy="114.5" r="1.6" fill="#ffffff"/>
    <path d="M92 117 Q104 107 120 115" fill="none" stroke="#17181d" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M164 117 Q152 107 136 115" fill="none" stroke="#17181d" stroke-width="3.5" stroke-linecap="round"/>

    <!-- the smallest nose -->
    <path d="M127 132 L125 138" fill="none" stroke="#dba57d" stroke-width="2.5" stroke-linecap="round"/>

    <!-- small quiet lips, the faintest warmth -->
    <path d="M118 148 Q128 145 138 148 Q133 154 128 154 Q123 154 118 148 Z" fill="#b3606a"/>
  </g>
</svg>
