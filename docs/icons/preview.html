<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>claude-voice icons</title>
<style>
  body { background:#0d0f16; color:#e8ecf6; font-family:Consolas,Menlo,monospace;
         display:flex; flex-wrap:wrap; gap:48px; justify-content:center;
         align-items:flex-start; padding:40px; }
  figure { margin:0; text-align:center; }
  figcaption { margin-top:14px; font-size:18px; }
  small { color:#8b96b0; }
  .row img { margin:6px; vertical-align:middle; }
</style>
</head>
<body>
  <figure>
    <img src="abby.svg" width="256" alt="Abby">
    <div class="row">
      <img src="abby.svg" width="96"><img src="abby.svg" width="48"><img src="abby.svg" width="24">
    </div>
    <figcaption>Abby<br><small>calm · warm · slightly nerdy</small></figcaption>
  </figure>
  <figure>
    <img src="max.svg" width="256" alt="Max">
    <div class="row">
      <img src="max.svg" width="96"><img src="max.svg" width="48"><img src="max.svg" width="24">
    </div>
    <figcaption>Max<br><small>brave · driving · one more rep</small></figcaption>
  </figure>
</body>
</html>
