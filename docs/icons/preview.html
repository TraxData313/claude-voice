<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>claude-voice icons</title>
<style>
  body { background:#0d0f16; color:#e8ecf6; font-family:Consolas,Menlo,monospace;
         display:flex; flex-wrap:wrap; gap:48px; justify-content:center;
         align-items:flex-start; padding:40px; }
  figure { margin:0; text-align:center; }
  figcaption { margin-top:14px; font-size:18px; }
  small { color:#8b96b0; }
  .row { margin-top:10px; }
  .row img { margin:0 6px; vertical-align:middle; }
  .note { width:100%; text-align:center; color:#8b96b0; font-size:13px; }
</style>
</head>
<body>
  <figure>
    <img src="abby-256.png" width="256" alt="Abby">
    <div class="row">
      <img src="abby-96.png" width="96"><img src="abby-48.png" width="48"><img src="abby-24.png" width="24">
    </div>
    <figcaption>Abby<br><small>calm &middot; warm &middot; slightly nerdy</small></figcaption>
  </figure>
  <figure>
    <img src="max-256.png" width="256" alt="Max">
    <div class="row">
      <img src="max-96.png" width="96"><img src="max-48.png" width="48"><img src="max-24.png" width="24">
    </div>
    <figcaption>Max<br><small>brave &middot; driving &middot; one more rep</small></figcaption>
  </figure>
  <p class="note">256 / 96 / 48 / 24 &mdash; the small ones are what the panel uses.</p>
</body>
</html>
